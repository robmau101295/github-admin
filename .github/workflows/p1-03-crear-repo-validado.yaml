# ============================================================
# P1.3 - Crear repo validado
# ------------------------------------------------------------
#  [ ] Nombre "P1.3 - Crear repo validado"
#  [ ] Mover el env para que lo vean los 2 jobs
#  [ ] Job "validar" (antes de crear):
#      [ ] Nombre no cumple ^ms-[a-z0-9-]+$ -> ::error:: + exit 1
#      [ ] Nombre > 40 caracteres          -> ::error:: + exit 1
#      [ ] Si pasa todo                     -> ::notice:: válido
#  [ ] Job "crear": solo si "validar" salió bien (needs)
#  [ ] Último step de "crear": tabla en $GITHUB_STEP_SUMMARY
#      con nombre, visibilidad y URL
#
# Herramientas:
#   [[ "$VAR" =~ ^patron$ ]]      comparar con patrón
#   ${#VAR}  y  -gt 40            largo del texto
#   echo "::error title=X::msg"   anotación de error
#   exit 1                        fallar el step
#   needs: validar                ordenar jobs
#   >> "$GITHUB_STEP_SUMMARY"     escribir el resumen
#
# Predicciones (llenar ANTES de probar):
#   repo-prueba   ->
#   MS-Pagos      ->
#   ms-pagos_api  ->
#   ms-pagos      ->
#
# Preguntas de cierre:
#  1. ¿Por qué validar en un job aparte y no en un step de crear?
#  2. ¿Qué pasa si quitas el $ del final del patrón?
#  3. ¿Dónde ves los ::error:: además del log?
# ============================================================

  # ============================================================
  # P1.4 - Idempotencia
  #  [ ] step "verificar" con id: output existe=true/false
  #      (+ ::notice:: si ya existe)
  #  [ ] "Crear repo" solo si existe == 'false'
  #  [ ] resumen: fila Estado -> Creado / Ya existía
  #
  #  gh repo view "$NOMBRE" > /dev/null 2>&1   -> 0 si existe
  #  echo "clave=valor" >> "$GITHUB_OUTPUT"
  #  if: steps.<id>.outputs.<clave> == 'false'
  # ============================================================

 # ============================================================
  # P1.5 - Configuración estándar
  #  [ ] input "equipo": choice pagos/usuarios/plataforma
  #  [ ] step "Configurar estándar" (SIEMPRE, sin if):
  #      gh repo edit con: delete-branch-on-merge, sin wiki,
  #      sin projects, solo squash, topics microservicio +
  #      equipo-<x>
  #  [ ] step "Verificar configuración": gh repo view --json
  #  [ ] resumen: fila Equipo
  #
  #  Pruebas: or-cami -> activar wiki a mano -> correr de nuevo
  # ============================================================

name: "P1.3 - Crear repo validado"

on:
  workflow_dispatch:
    inputs:
      nombre:
        description: "Nombre del Repo"
        required: true
        type: string
      descripcion:
        type: string
        default: "Repo creado por github-admin"
      visibilidad:
        type: choice
        options: 
          - public
          - private
        default: public
      con_readme:
        type: boolean
        default: true
      equipo:
        type: choice
        options:
          - pagos
          - usuarios
          - plataforma
env:
  NOMBRE: ${{ inputs.nombre }}
  EQUIPO: ${{ inputs.equipo }}
  DESCRIPCION: ${{ inputs.descripcion }}
  VISIBILIDAD: ${{ inputs.visibilidad }}
  CON_README: ${{ inputs.con_readme && '--add-readme' || '' }}

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7                

      - name: "Validar nombre"
        uses: ./.github/actions/validar  
        with:
          nombre: ${{ inputs.nombre }}        
          prefijo: "or-"
          max_largo: "10"  
          
  crear:
    needs: validar
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - name: "Verificar si existe"
        id: check
        run: |
          if gh repo view "$NOMBRE" > /dev/null 2>&1; then
            echo "::notice title=Repo existente::'$NOMBRE' ya existe, se omite la creación"
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Crear repo"  
        if: steps.check.outputs.existe == 'false'        
        run: |
          gh repo create $NOMBRE --$VISIBILIDAD --description "$DESCRIPCION" $CON_README

      - name: "Configurar estándar"
        run: |
          gh repo edit "$NOMBRE" \
            --delete-branch-on-merge \
            --enable-wiki=false \
            --enable-projects=false \
            --enable-squash-merge \
            --enable-merge-commit=false \
            --enable-rebase-merge=false \
            --add-topic microservicio \
            --add-topic "equipo-$EQUIPO"

      - name: "Verificar configuracion"
        run: |
          gh repo view "$NOMBRE" \
            --json deleteBranchOnMerge,hasWikiEnabled,hasProjectsEnabled,squashMergeAllowed,mergeCommitAllowed,rebaseMergeAllowed,repositoryTopics

      - name: "Resumen"
        env:
          ESTADO: ${{ steps.check.outputs.existe == 'false' && 'CREADO!' || 'YA EXISTIA!'}}                         # ← tu parte
        run: |
          URL=$(gh repo view "$NOMBRE" --json url --jq '.url')
          echo "## Repo" >> "$GITHUB_STEP_SUMMARY"
          echo "| Campo | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Nombre | $NOMBRE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Estado | $ESTADO |" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | $URL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Equipo | $EQUIPO |" >> "$GITHUB_STEP_SUMMARY"
